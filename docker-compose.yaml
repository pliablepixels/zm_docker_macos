version: '3'

services:
  db:
    container_name: db
    image: mariadb
    restart: always
    networks:
      - zoneminder
    volumes:
      - ./zm/db:/var/lib/mysql
      - ./mariadb.cnf:/etc/mysql/conf.d/zoneminder.cnf:ro
    environment:
      - MYSQL_DATABASE=zm
    env_file:
      - ./.env

  zoneminder:
    container_name: zoneminder
    image: ghcr.io/zoneminder-containers/eventserver-base:latest
    restart: always
    stop_grace_period: 45s
    depends_on:
      - db
    ports:
      - 80:80
      - 443:443
      - 9000:9000
      - 9001:9001
    networks:
      - zoneminder
    volumes:
      - ./zm/data:/data
      - ./zm/config:/config
      - ./zm/log:/log
      # Mount overrides directory (read-only)
      - ./overrides:/overrides:ro
      # Mount new ES run script (port 9000, from /pp)
      - ./overrides/zmeventnotification_run:/etc/services.d/zmeventnotification/run
      # Mount old/legacy ES (port 9001, from ZoneMinder/zmeventnotification)
      - ./overrides/zmeventnotification.pl:/usr/bin/zmeventnotification_old.pl
      - ./overrides/zmeventnotification_old_run:/etc/services.d/zmeventnotification-old/run
      # Mount logs config
      - ./overrides/03-logs.conf:/config/conf.d/03-logs.conf
      # Mount init scripts
      - ./overrides/49-nginx-override.sh:/etc/cont-init.d/49-nginx-override.sh
      - ./overrides/90-copy-secrets.sh:/etc/cont-init.d/90-copy-secrets.sh
      - ./overrides/95-install-fcm-deps.sh:/etc/cont-init.d/95-install-fcm-deps.sh
      - ./overrides/96-install-python-deps.sh:/etc/cont-init.d/96-install-python-deps.sh
      - ./pp:/pp
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1000000000
    env_file:
      - ./.env
#    environment:
#      - ZM_SERVER_HOST=zoneminder1


networks:
  zoneminder:
