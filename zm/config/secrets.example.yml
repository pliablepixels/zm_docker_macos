# Copy this file to secrets.yml and update with your values
# cp secrets.example.yml secrets.yml

secrets:
  ZMES_PICTURE_URL: http://YOUR_ZM_IP/index.php?view=image&eid=EVENTID&fid=alarm&width=600
  ZM_USER: admin
  ZM_PASSWORD: admin
  ES_ADMIN_INTERFACE_PASSWORD: your_admin_interface_password
  ZM_PORTAL: http://YOUR_ZM_IP
  ZM_API_PORTAL: https://YOUR_ZM_IP/api
  ES_CERT_FILE: /config/ssl/cert.cer
  ES_KEY_FILE: /config/ssl/key.pem
  ML_USER: your_mlapi_user
  ML_PASSWORD: your_mlapi_password
  PLATEREC_ALPR_KEY: your_plate_recognizer_api_key
  OPENALPR_ALPR_KEY: your_openalpr_api_key
  ESCONTROL_INTERFACE_PASSWORD: yourescontrolpassword
  MQTT_USERNAME: your_mqtt_username
  MQTT_PASSWORD: your_mqtt_password
  PUSHOVER_APP_TOKEN: your_pushover_app_token
  PUSHOVER_USER_KEY: your_pushover_user_key
